# 自动构建并发布 Docker 镜像到 GitHub Container Registry (GHCR)
#
# • 推送到 main 分支：构建并推送 latest + sha 标签
# • 推送版本标签（如 v2.8.7）：构建并推送对应版本标签
# • 手动触发（推荐流程）：
#     发布新版时 → Actions → "Build and publish Docker image" → Run workflow →
#     version 填写与 Release 相同的版本号（如 v2.8.7）→ 运行
#   （说明：Create Release 工作流自动推送的 tag 不会触发本工作流，
#    这是 GitHub 的防递归限制，因此用手动触发补版本标签）
# • 镜像地址：ghcr.io/<仓库所有者>/probedeck:<版本号 | latest>
# • 多架构：linux/amd64 + linux/arm64（ARM 服务器 / NAS / 树莓派直接可用）
# • 首次发布后如果镜像不可见：GitHub 主页 → Packages → probedeck → Package settings
#   → Change visibility → Public
#
# ⚠️ paths 白名单：只有会影响镜像内容的文件变动才触发构建。
#    改 README / docs / themes.json 等纯文档不再白构建一次镜像
#    （曾有用户反馈「更新文档也重新构建、GHCR 里多一个幽灵 sha 标签」）。
#    新增会影响镜像的目录/文件时，记得同步加进下面这个列表。
name: Build and publish Docker image

on:
  push:
    branches: [main]
    # 只在这些路径变化时构建（tags 触发不受 paths 限制）
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'themes.json'
      - 'version.json'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '同时发布的版本标签（可选，例如 v2.8.7，需与 Release 版本一致）'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: probedeck

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 模拟构建)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata（生成镜像标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
