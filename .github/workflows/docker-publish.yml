# 自动构建并发布 Docker 镜像到 GitHub Container Registry (GHCR)
#
# • 推送到 main 分支：构建并推送 latest + sha 标签
# • 推送版本标签（如 v2.8.6）：构建并推送对应版本标签（v2.8.6）+ latest
# • 也可以在仓库 Actions 页面手动触发
# • 镜像地址：ghcr.io/<仓库所有者>/probedeck:<版本号 | latest>
# • 首次发布后如果镜像不可见：GitHub 主页 → Packages → probedeck → Package settings
#   → Change visibility → Public
name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: probedeck

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata（生成镜像标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
