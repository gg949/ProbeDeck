# 自动创建 GitHub Release（版本发布）
#
# 触发方式：仓库 Actions 页面 → 左侧选 "Create Release" → Run workflow → 填版本号（如 v2.8.7）
#
# 创建后会自动：
#   • 打上版本 tag 并创建 Release（说明内含三种安装方式）
#   • 附带 install.sh（一键安装脚本）与 docker-compose.yml 附件
#
# 注意：GitHub 的防递归限制——本工作流推送的 tag 不会自动触发镜像构建。
#   发版后请再手动跑一次 "Build and publish Docker image"（version 填相同版本号），
#   镜像就会带上版本标签（ghcr.io/gg949/probedeck:v2.8.7）。
name: Create Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v2.8.7）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag（手动触发时自动打标签）
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## 📦 安装方式

            ### 方式一：一键脚本（推荐）

            ```bash
            curl -fsSL https://github.com/gg949/ProbeDeck/releases/latest/download/install.sh | bash
            ```

            ### 方式二：Docker 命令

            ```bash
            docker run -d --name probedeck --restart unless-stopped -p 17986:17986 \
              -v /opt/probedeck/data:/app/data \
              ghcr.io/gg949/probedeck:${{ env.VERSION }}
            ```

            ### 方式三：docker compose

            下载下方附件中的 `docker-compose.yml`，将镜像地址改为 `ghcr.io/gg949/probedeck:${{ env.VERSION }}` 后执行 `docker compose up -d`。

            ---

            - 镜像地址：`ghcr.io/gg949/probedeck:${{ env.VERSION }}`（`latest` 同源）
            - 初始密码：`docker logs probedeck 2>&1 | grep API_SECRET`
            - 完整变更记录：https://github.com/gg949/ProbeDeck/commits/${{ env.VERSION }}
            - 完整文档：[README](https://github.com/gg949/ProbeDeck/blob/main/README.md)
          files: |
            install.sh
            docker-compose.yml
          prerelease: ${{ contains(env.VERSION, 'beta') || contains(env.VERSION, 'rc') }}
          make_latest: ${{ !(contains(env.VERSION, 'beta') || contains(env.VERSION, 'rc')) }}
